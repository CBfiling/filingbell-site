<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213D;
    --ink-soft: #1E2E52;
    --paper: #ECE7D8;
    --paper-dim: #DCD6C3;
    --red: #B23A2E;
    --green: #4C7A5E;
    --line: #5B6B7A;
    --display: 'Zilla Slab', serif;
    --body: 'Source Serif 4', serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--body);
    line-height: 1.6;
  }

  a { color: inherit; }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- NAV ---------- */
  nav.wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 28px;
    padding-bottom: 28px;
  }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .logo b { color: var(--red); }
  .nav-links { font-family: var(--mono); font-size: 13px; color: var(--paper-dim); }

  /* ---------- HERO ---------- */
  header.hero {
    padding: 40px 0 90px;
    position: relative;
    overflow: visible;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--paper-dim);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .eyebrow::before {
    content: "";
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    display: inline-block;
  }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(38px, 6vw, 64px);
    line-height: 1.05;
    margin: 0 0 26px;
    max-width: 11ch;
  }

  .hero-sub {
    font-size: 19px;
    color: var(--paper-dim);
    max-width: 46ch;
    margin: 0 0 40px;
  }

  .hero-sub em { color: var(--paper); font-style: normal; border-bottom: 1px solid var(--red); }

  .stat-strip {
    display: flex;
    gap: 24px;
    margin: 0 0 36px;
    flex-wrap: wrap;
  }
  .stat {
    flex: 1 1 200px;
    border-left: 2px solid var(--red);
    padding-left: 16px;
  }
  .stat-num {
    font-family: var(--display);
    font-size: 32px;
    font-weight: 700;
    color: var(--paper);
    line-height: 1.1;
  }
  .stat-label {
    font-size: 13px;
    color: var(--paper-dim);
    margin-top: 6px;
    max-width: 34ch;
  }

  /* Stamp element -- the signature piece */
  .stamp {
    position: absolute;
    top: 30px;
    right: 24px;
    width: 138px;
    height: 138px;
    border: 3px solid var(--red);
    border-radius: 50%;
    color: var(--red);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: rotate(9deg);
    opacity: 0.9;
    animation: stampIn 0.5s cubic-bezier(.2,1.4,.4,1) 0.15s both;
  }
  .stamp-inner {
    font-size: 12px;
    letter-spacing: 0.06em;
    line-height: 1.5;
  }
  .stamp-inner .big { font-size: 20px; font-weight: 700; display: block; letter-spacing: 0.08em; }

  @keyframes stampIn {
    from { transform: rotate(9deg) scale(2.4); opacity: 0; }
    to   { transform: rotate(9deg) scale(1); opacity: 0.9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp { animation: none; }
  }
  @media (max-width: 640px) {
    .stamp { position: static; margin-bottom: 28px; transform: rotate(-3deg); }
  }

  /* ---------- SIGNUP FORM ---------- */
  form.signup {
    display: flex;
    gap: 10px;
    max-width: 460px;
    flex-wrap: wrap;
  }
  input[type="email"] {
    flex: 1 1 240px;
    background: var(--ink-soft);
    border: 1px solid var(--line);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 14px;
    padding: 14px 16px;
    border-radius: 3px;
  }
  input[type="email"]::placeholder { color: var(--paper-dim); }
  input[type="email"]:focus, button:focus {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }
  button.cta, a.cta {
    background: var(--red);
    color: var(--paper);
    border: none;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.03em;
    padding: 14px 22px;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.cta:hover, a.cta:hover { background: #9c2f25; }
  .form-note {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--paper-dim);
    margin-top: 12px;
  }

  /* ---------- SECTION SCAFFOLDING ---------- */
  section { padding: 64px 0; border-top: 1px solid rgba(236,231,216,0.15); }
  .section-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 18px;
  }
  h2 {
    font-family: var(--display);
    font-size: clamp(26px, 4vw, 34px);
    font-weight: 600;
    margin: 0 0 20px;
    max-width: 22ch;
  }
  .lead { color: var(--paper-dim); max-width: 56ch; font-size: 17px; margin-bottom: 40px; }

  /* ---------- SAMPLE DIGEST TABLE ---------- */
  .digest-frame {
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--line);
    padding: 14px 16px;
    border-bottom: 1px solid var(--paper-dim);
  }
  tbody td { padding: 14px 16px; border-bottom: 1px solid var(--paper-dim); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  .company { font-weight: 600; font-family: var(--body); }
  .ticker { font-family: var(--mono); font-size: 12px; color: var(--line); }
  .badge {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 10px;
    color: white;
    white-space: nowrap;
  }

  /* ---------- MOBILE-ONLY: stack the digest table as cards instead of
     a wide table, since the longer signal labels no longer fit in a row
     on narrow screens. Desktop table styles above are untouched. ---------- */
  @media (max-width: 640px) {
    .digest-frame table,
    .digest-frame thead,
    .digest-frame tbody,
    .digest-frame th,
    .digest-frame td,
    .digest-frame tr {
      display: block;
    }
    .digest-frame thead { display: none; }
    .digest-frame tr {
      border-bottom: 2px solid var(--paper-dim);
      padding: 12px 0;
    }
    .digest-frame tbody tr:last-child { border-bottom: none; }
    .digest-frame td {
      border-bottom: none;
      padding: 4px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .digest-frame td[data-label]::before {
      content: attr(data-label);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--line);
      flex-shrink: 0;
    }
    .digest-frame td[data-label="Company"] {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding-top: 8px;
    }
    .digest-frame td[data-label="Company"]::before { display: none; }
  }

  /* ---------- HOW IT WORKS ---------- */
  .steps { display: grid; gap: 28px; }
  .step { display: grid; grid-template-columns: 56px 1fr; gap: 20px; align-items: start; }
  .step-num {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
  }
  .step h3 { font-family: var(--display); font-size: 18px; margin: 8px 0 6px; font-weight: 600; }
  .step p { color: var(--paper-dim); margin: 0; font-size: 15px; max-width: 52ch; }

  /* ---------- WHO IT'S FOR ---------- */
  .audience-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1px;
    background: rgba(236,231,216,0.15);
    border: 1px solid rgba(236,231,216,0.15);
  }
  .audience-card { background: var(--ink); padding: 24px; }
  .audience-card .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
    display: block;
  }
  .audience-card p { margin: 0; font-size: 14.5px; color: var(--paper-dim); }

  /* ---------- TRACK RECORD ---------- */
  .track-record-box {
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 32px;
    text-align: center;
  }
  .faq { display: grid; gap: 24px; }
  .faq-item { max-width: 62ch; }
  .faq-q {
    font-family: var(--display);
    font-size: 17px;
    font-weight: 600;
    color: var(--paper);
    margin-bottom: 6px;
  }
  .faq-a { color: var(--paper-dim); font-size: 15px; }
  .track-record-box .big-label {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--paper-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ---------- FOOTER ---------- */
  footer { padding: 50px 0 60px; }
  .disclaimer {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--paper-dim);
    max-width: 60ch;
    border-left: 2px solid var(--line);
    padding-left: 16px;
    margin-top: 40px;
  }
</style>
</head>
<body>

<nav class="wrap">
  <div class="logo">Filing<b>Bell</b></div>
  <div class="nav-links">SEC EDGAR &middot; 8-K Filings &middot; Daily</div>
</nav>

<header class="hero wrap">
  <div class="stamp">
    <div class="stamp-inner">NEW<span class="big">8-K</span>TODAY</div>
  </div>
  <div class="eyebrow">Scanning EDGAR every day</div>
  <h1>Know the moment a company puts itself in play.</h1>
  <p class="hero-sub">Every day, public companies quietly tell the SEC they're <em>exploring a sale,
